<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한화에어로스페이스 사업부 퀴즈</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{--deep:#060D1F;--panel:#0F1930;--panel2:#16233F;--line:#22314F;
    --flame:#F37321;--ignite:#FFC845;--ink:#EAF0FC;--mute:#8195B8;--ok:#4ADE80;--no:#F87171}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #app{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
    background:var(--deep);color:var(--ink);min-height:100vh;padding:34px 40px 70px;position:relative;overflow-x:hidden}
  #app::before{content:"";position:fixed;top:-42%;left:50%;transform:translateX(-50%);width:1100px;height:1100px;
    border-radius:50%;background:radial-gradient(circle,rgba(243,115,33,.13),transparent 64%);pointer-events:none;z-index:0}
  #app>*{position:relative;z-index:1}
  .wrap{max-width:820px;margin:0 auto}.wrap.wide{max-width:1180px}.wrap.narrow{max-width:560px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;font-size:14px;color:var(--mute)}
  .bar b{color:var(--ink);font-weight:600}.bar .rt{display:flex;align-items:center;gap:12px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px}
  .chip.hot{border-color:var(--flame);color:var(--ignite)}
  .home{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer}
  .home:hover{border-color:var(--flame);color:var(--ink)}
  h1{font-size:44px;line-height:1.22;font-weight:700;margin:0 0 12px;letter-spacing:-.028em}
  h2{font-size:29px;font-weight:650;margin:0 0 24px;letter-spacing:-.02em;line-height:1.42}
  h3{font-size:17px;font-weight:650;margin:32px 0 12px}
  p.sub{color:var(--mute);font-size:16px;line-height:1.7;margin:0 0 26px}
  label{display:block;font-size:13.5px;color:var(--mute);margin:18px 0 8px}
  input,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:15px;font-size:16px;font-family:inherit;outline:none}
  input:focus,select:focus{border-color:var(--flame)}
  button{font-family:inherit;cursor:pointer;border:none}
  .go{width:100%;background:var(--flame);color:#0B1226;font-weight:700;font-size:16.5px;border-radius:13px;padding:17px;margin-top:22px}
  .go:disabled{opacity:.3;cursor:default}
  .ghost{width:100%;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:13px;padding:15px;font-size:15px;margin-top:11px}
  .ghost:hover{border-color:var(--flame);color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:19px 22px;font-size:17.5px;line-height:1.5;transition:border-color .12s,background .12s;position:relative}
  .opt:hover:not(:disabled){border-color:var(--flame)}
  .opt.pick{border-color:var(--flame);background:var(--panel2)}
  .opt.right{border-color:var(--ok);background:rgba(74,222,128,.13)}
  .opt.wrong{border-color:var(--no);background:rgba(248,113,113,.13)}
  .opt:disabled{cursor:default}
  .mine-tag{position:absolute;top:-9px;right:14px;background:var(--flame);color:#0B1226;
    font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .ox{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ox button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:18px;
    padding:56px 0;font-size:62px;font-weight:700;line-height:1;position:relative}
  .ox button:hover:not(:disabled){border-color:var(--flame)}
  .ox button.pick{border-color:var(--flame);background:var(--panel2)}
  .ox button.right{border-color:var(--ok);background:rgba(74,222,128,.13);color:var(--ok)}
  .ox button.wrong{border-color:var(--no);background:rgba(248,113,113,.13);color:var(--no)}
  .clock{font-size:62px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:0 0 18px;line-height:1}
  .clock.low{color:var(--no)}
  .clock small{display:block;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-top:6px}
  .bubadge{display:inline-flex;align-items:center;gap:10px;border:1px solid;border-radius:999px;
    padding:9px 20px 9px 17px;font-size:15px;font-weight:650;margin-bottom:18px;letter-spacing:-.01em}
  .bubadge .bdot{width:9px;height:9px;border-radius:50%;flex:none}
  .livewrap{text-align:center;margin:-6px 0 20px}
  .live{display:inline-block;background:rgba(255,200,69,.12);border:1px solid rgba(255,200,69,.4);
    color:var(--ignite);border-radius:999px;padding:8px 20px;font-size:15px}
  .live b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .verdict{border-radius:16px;padding:22px 26px;margin-bottom:18px;display:flex;align-items:center;
    justify-content:space-between;gap:18px;animation:pop .34s cubic-bezier(.2,1.5,.4,1)}
  .verdict .t{font-size:27px;font-weight:700;letter-spacing:-.02em}
  .verdict .s{font-size:14.5px;opacity:.85;margin-top:5px}
  .verdict .pt{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .verdict.ok{background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.5);color:var(--ok)}
  .verdict.part{background:rgba(255,200,69,.14);border:1px solid rgba(255,200,69,.5);color:var(--ignite)}
  .verdict.no{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.5);color:var(--no)}
  .verdict.na{background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
  @keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1);opacity:1}}
  .reveal{background:#0B1226;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    height:340px;position:relative;margin-bottom:16px}
  .reveal img{width:100%;height:100%;object-fit:cover;display:block}
  .reveal .tile{position:absolute;background:#0B1226}
  .reveal .tile::after{content:"";position:absolute;inset:1px;border-radius:3px;background:#16233F}
  .ord{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:17px 20px;font-size:16.5px;margin-bottom:10px;line-height:1.45}
  .ord:hover:not(:disabled){border-color:var(--flame)}
  .ord .n{min-width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mute);flex:none}
  .ord.on{border-color:var(--flame);background:var(--panel2)}
  .ord.on .n{background:var(--flame);border-color:var(--flame);color:#0B1226}
  .ord.right{border-color:var(--ok);background:rgba(74,222,128,.12)}
  .ord.right .n{background:var(--ok);border-color:var(--ok);color:#0B1226}
  .ord:disabled{cursor:default}
  .ansbox{font-size:26px;padding:24px;text-align:center;font-weight:600}
  .rank{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .rank:last-child{border-bottom:none}
  .rank .p{font-size:20px;font-weight:700;color:var(--mute);min-width:26px;font-variant-numeric:tabular-nums}
  .rank.top .p{color:var(--ignite)}.rank.mine{background:rgba(243,115,33,.07)}
  .rank .nm{flex:1;font-size:16px;font-weight:600}
  .rank .dl{font-size:12.5px;color:var(--mute);margin-left:8px;font-weight:500}
  .rank .sc{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .resp{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
  .resp:last-child{border-bottom:none}
  .resp .who{color:var(--mute);min-width:118px;font-size:13px}
  .resp .val{flex:1;font-weight:600}
  .resp .mk{font-size:16px;font-weight:800}
  .resp.y .mk{color:var(--ok)}.resp.n .mk{color:var(--no)}
  .note{font-size:13.5px;color:var(--mute);line-height:1.7;margin-top:16px}
  .wait{text-align:center;padding:80px 0;color:var(--mute);font-size:16px;line-height:1.85}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--flame);margin-right:8px;animation:bp 1.6s infinite}
  @keyframes bp{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}.reveal .inner{transition:none}.verdict{animation:none}}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:26px;align-items:start}
  .abar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .abar button{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:11px 15px;font-size:13.5px}
  .abar button.on{background:var(--flame);border-color:var(--flame);color:#0B1226;font-weight:650}
  .row{display:flex;gap:10px}.row>button{flex:1}
  .ctl{border-radius:12px;padding:16px;font-size:15px;font-weight:600}
  .tiny{font-size:12.5px;color:var(--mute);margin-top:9px;line-height:1.7}
  .bet{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .bet button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:13px;padding:20px 0;font-size:22px;font-weight:700}
  .bet button.pick{border-color:var(--ignite);background:rgba(255,200,69,.13);color:var(--ignite)}
  .pv{background:#0B1226;border:1px solid var(--line);border-radius:14px;padding:18px;font-size:13px}
  .pv .pvq{font-size:16px;font-weight:650;line-height:1.45;margin:10px 0 12px}
  .pv .pvo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pv .pvo span{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px}
  .pv .pvo span.a{border-color:var(--ok);color:var(--ok)}
  .pv .pvt{font-size:30px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
  .pv .pvimg{height:130px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:#070E22}
  .pv .pvimg img{width:100%;height:100%;object-fit:cover}
  .pv .pvimg .tile{position:absolute;background:#0B1226}
  .pv .pvimg .tile::after{content:"";position:absolute;inset:.5px;background:#16233F}
  .pvmsg{color:var(--mute);text-align:center;padding:36px 0;font-size:14px}
  .simbar{display:flex;gap:8px;margin-top:10px}
  .simbar button{flex:1;background:var(--panel2);border:1px dashed var(--line);color:var(--mute);
    border-radius:10px;padding:11px;font-size:12.5px}
  .simbar button:hover{border-color:var(--flame);color:var(--ink)}
  .envnote{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;line-height:1.65}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--mute);margin-right:6px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="wait"><span class="pulse"></span>불러오는 중</div></div></div>

/* 저장소: Supabase Postgres (테이블 kv: id text pk, value text, updated_at)
   아래 두 값만 본인 프로젝트 값으로 바꾸면 됩니다. → supabase_schema.sql 참고 */
const SUPABASE_URL = "https://enrwlwmlsymenjiripnw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVucndsd21sc3ltZW5qaXJpcG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTgyMjMsImV4cCI6MjEwNDkzNDIyM30.DFt-CJA8xNJ179tavfBChMh6bpzpVyGabHGx40P7IO8";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORE = {
  async set(k, v){
    const { error } = await sb.from("kv").upsert({ id:k, value:v, updated_at:new Date().toISOString() });
    if(error){ console.error("[supabase set]", error.message); return null; }
    return { key:k, value:v };
  },
  async get(k){
    const { data, error } = await sb.from("kv").select("value").eq("id", k).maybeSingle();
    if(error){ console.error("[supabase get]", error.message); return null; }
    return data ? { key:k, value:data.value } : null;
  },
  async delete(k){
    const { error } = await sb.from("kv").delete().eq("id", k);
    if(error){ console.error("[supabase delete]", error.message); return null; }
    return { key:k, deleted:true };
  },
  async list(prefix){
    const { data, error } = await sb.from("kv").select("id").like("id", prefix.replace(/[%_]/g,"\\$&")+"%");
    if(error){ console.error("[supabase list]", error.message); return { keys:[] }; }
    return { keys: data.map(r=>r.id) };
  }
};

let CONN_ERR = null;
async function checkConnection(){
  try{
    const { error } = await sb.from("kv").select("id").limit(1);
    if(error){
      if(error.code === "42P01") CONN_ERR = "테이블(kv)이 없습니다. supabase_schema.sql을 SQL Editor에서 실행했는지 확인하세요.";
      else if(error.code === "42501" || /permission/i.test(error.message||"")) CONN_ERR = "권한 오류입니다. RLS 정책 4개가 모두 생성됐는지 확인하세요.";
      else if(/apikey|api key|invalid/i.test(error.message||"")) CONN_ERR = "API 키 또는 URL이 올바르지 않습니다. 앞뒤 공백 없이 다시 확인하세요.";
      else CONN_ERR = error.message || "알 수 없는 오류";
    } else CONN_ERR = null;
  }catch(e){ CONN_ERR = "Supabase 서버에 연결할 수 없습니다 (" + (e.message||e) + ")"; }
  return !CONN_ERR;
}

async function get(k){ try{ const r=await STORE.get(K(k),true); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function fetchPeers(){

    return out;

const durOf = (ri,qi) => (qi!==undefined && ROUNDS[ri]?.qs?.[qi]?.sec) || ROUNDS[ri]?.sec || COUNT;
let CLOCK_OFF = 0;   // (서버 기준 시각 - 내 시계) 보정값
const nowMs = () => Date.now() + CLOCK_OFF;
const secLeft = () => {
  const dur = durOf(S.ctrl.ri, S.ctrl.qi);
  if(!S.ctrl.started) return dur;
  return Math.max(0, Math.ceil(dur - (nowMs() - S.ctrl.started)/1000));
};
// 속도 배점: 정답 기본점수 × (1 − spd × 경과비율). spd=0.5면 최소 50%까지만 감소
const spdOf = ri => ROUNDS[ri]?.spd ?? 0;
const graceOf = ri => ROUNDS[ri]?.grace ?? 0;
function factorNow(){
  const ri = S.ctrl.ri, d = durOf(ri,S.ctrl.qi), g = Math.min(graceOf(ri), d);
  const t = Math.min(d, Math.max(0, (nowMs()-(S.ctrl.started||nowMs()))/1000));
  if(t <= g || d === g) return 1;            // 만점 유지 구간
  return 1 - spdOf(ri) * ((t - g) / (d - g)); // 이후 선형 감소
}
const ptsNow = () => Math.round((ROUNDS[S.ctrl.ri]?.pt||0) * factorNow());
const BUC = { "우주사업부":"#7C9BFF", "항공사업부":"#4CC9F0", "PGM사업부":"#FF7A7A",

const revealed = () => !!(S.ctrl && (S.ctrl.show || secLeft()===0));
function tilesHTML(ri,qi,frac){
  const {cols,rows}=TILE, N=cols*rows;
  const order = shufOf(ri*7+3, qi*11+5, N);
  const pos = new Array(N);
  order.forEach((tileIdx,k)=>{ pos[tileIdx]=k; });
  const shown = Math.round(N*Math.max(0,Math.min(1,frac)));
  let h="";
  for(let i=0;i<N;i++){
    if(pos[i] < shown) continue;
    const r=Math.floor(i/cols), c=i%cols;
    h += `<div class="tile" style="left:${(c/cols*100).toFixed(3)}%;top:${(r/rows*100).toFixed(3)}%;width:${(100/cols).toFixed(3)}%;height:${(100/rows).toFixed(3)}%"></div>`;
  }
  return h;
}
const shufOf = (ri,qi,n) => { const a=[...Array(n).keys()]; let s=(ri+1)*97+(qi+1)*31;
  for(let i=n-1;i>0;i--){ s=(s*1103515245+12345)&0x7fffffff; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// 주관식 채점: 대소문자·띄어쓰기·구두점 무시, 쉼표로 구분된 복수 정답 인정
const norm = s => String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[.,·''""]/g,"");
const textOK = (v,q) => !!norm(v) && q.a.split(",").some(x => norm(x) === norm(v));

function gradeOne(r, q, a){
  if(a===undefined) return { state:"na", pt:0 };
  const k = a.k ?? 1;
  if(r.type==="ox"||r.type==="mc") return a.v===q.a ? {state:"ok",pt:Math.round(r.pt*k),k} : {state:"no",pt:0,k};
  if(r.type==="text")  return textOK(a.v,q) ? {state:"ok",pt:Math.round(r.pt*k),k} : {state:"no",pt:0,k};
  if(r.type==="image") return a.v===q.a ? {state:"ok",pt:a.pt} : {state:"no",pt:0};
  if(r.type==="bet")   return a.v===q.a ? {state:"ok",pt:a.b} : {state:"no",pt:-a.b};
  if(r.type==="order"){
    const c=a.v.filter((v,i)=>v===i).length;
    return { state: c===q.items.length?"ok":(c>0?"part":"no"),
             pt: Math.round(r.pt*(c/q.items.length)*k), hit:c, of:q.items.length, k };
  }
  return { state:"na", pt:0 };
}

      제품 맞히기는 사진이 드러날수록 점수가 내려갑니다. 틀리면 0점이니 빠르게, 그리고 정확하게.</p>

/* ── 루프 ──────────────────────────────────────────────────────── */
async function start(){
  clearInterval(S.tick);
  const my = ++S.epoch;                          // 이 시작 이후의 응답만 반영합니다
  await sync(my);
  S.tick = setInterval(()=>sync(my), S.admin?1500:3000);
  clearInterval(S.tickC);
  S.tickC = setInterval(()=>pollCtrl(my), 700);   // 문제 전환은 0.7초마다 감지
  if(S.admin) setInterval(()=>{ if(my===S.epoch && S.admin && S.ctrl?.live && !S.ctrl.show) screenAdmin(); }, 500);
}
async function sync(my){
  const ctrl=(await get("ctrl"))||D0, peers=await fetchPeers();
  if(my!==undefined && my!==S.epoch) return;      // 화면이 이미 바뀐 뒤 늦게 온 응답은 버립니다
  S.ctrl=ctrl; S.peers=peers; paint();
}
// 문제 전환을 즉시 감지하기 위해 ctrl만 짧은 주기로 확인합니다
async function pollCtrl(my){
  const ctrl = await get("ctrl");
  if(!ctrl || (my!==undefined && my!==S.epoch)) return;
  const changed = !S.ctrl || ctrl.ri!==S.ctrl.ri || ctrl.qi!==S.ctrl.qi
                  || ctrl.show!==S.ctrl.show || ctrl.live!==S.ctrl.live || ctrl.started!==S.ctrl.started;
  if(changed){ S.ctrl=ctrl; S.rendered=null; S.sig=null; paint(true); }
}
function refreshClock(){
  const t = secLeft();
  const cl = el.querySelector(".clock");
  if(!cl) return paint(true);
  if(cl.firstChild) cl.firstChild.nodeValue = String(t);
  cl.classList.toggle("low", t<=3);
  const lv = el.querySelector(".live b");
  if(lv) lv.textContent = ptsNow()+"점";
  if(t===0) paint(true);
}
function sig(){
  const c=S.ctrl, id=qid(c);
  return [c.ri, c.qi, c.live?1:0, revealed()?1:0, c.started||0,
          S.me ? JSON.stringify(S.me.ans[id] ?? null) : ""].join("|");
}
function paint(force){
  if(S.admin) return screenAdmin();
  if(!S.me) return;
  if(!S.ctrl.live) return screenReady();
  const rr = ROUNDS[S.ctrl.ri], iid = qid(S.ctrl);
  // 정답 공개 후에는 바뀔 게 없으므로 다시 그리지 않는다 (배너 애니메이션 반복 방지)
  const sg = sig();
  if(!force && S.sig===sg && ROUNDS[S.ctrl.ri]?.type!=="image") return;  // 내용이 같으면 다시 그리지 않음
  // 주관식 입력 중에는 전체 리렌더 대신 타이머만 갱신 (입력값 유지)
  if(!force && rr?.type==="text" && !revealed() && S.me.ans[iid]===undefined
     && S.rendered===iid && el.querySelector("#tv")) return refreshClock();
  S.sig = sg;
  S.rendered = iid;
  const t = ROUNDS[S.ctrl.ri]?.type;
  if(!t) return screenFinal();
  if(t==="ox") return screenOX();
  if(t==="mc"||t==="bet") return screenChoice(t);
  if(t==="text") return screenText();
  if(t==="order") return screenOrder();
  if(t==="image") return screenIMG();
}
function head(right){
  return `<div class="bar"><span><b>${esc(S.me.name)}</b> · ${S.me.team}팀</span>
    <span class="rt"><span class="chip hot">${right}</span><button class="home" data-home>처음으로</button></span></div>`;
}
function bindHome(){ el.querySelectorAll("[data-home]").forEach(b=>b.onclick=goHome); }
function clock(t){
  const r=ROUNDS[S.ctrl.ri];
  if(revealed()) return "";
  const live = spdOf(S.ctrl.ri)>0
    ? `<span class="live">지금 맞히면 <b>${ptsNow()}점</b></span>` : "";
  return `<div class="clock ${t<=3?"low":""}">${t}<small>${esc(r.hint)}</small></div>${live?`<div class="livewrap">${live}</div>`:""}`;
}

function verdict(){
  if(!revealed()) return "";
  const c=S.ctrl, r=ROUNDS[c.ri], q=curQ(c), g=gradeOne(r,q,S.me.ans[qid(c)]);
  if(g.state==="na") return `<div class="verdict na"><div><div class="t">시간 초과</div>
    <div class="s">답을 제출하지 못했습니다</div></div><div class="pt">0</div></div>`;

  if(g.state==="part") return `<div class="verdict part"><div><div class="t">부분 정답</div>
    <div class="s">${g.hit} / ${g.of} 자리를 맞혔습니다</div></div><div class="pt">+${g.pt}</div></div>`;
  return `<div class="verdict no"><div><div class="t">아쉽습니다</div>

/* ── 점수 ──────────────────────────────────────────────────────── */
function counted(ri,qi){
  if(ri>S.ctrl.ri) return false;
  if(ri===S.ctrl.ri && qi>S.ctrl.qi) return false;
  if(ri===S.ctrl.ri && qi===S.ctrl.qi && !revealed()) return false;
  return true;
}
function scores(){
  const T={}; S.peers.forEach(p=>{ T[p.team]??={n:0,sc:0}; T[p.team].n++; });
  ROUNDS.forEach((r,ri)=>r.qs.forEach((q,qi)=>{
    if(!counted(ri,qi)) return;
    const id=`${ri}-${qi}`;
    Object.keys(T).forEach(k=>{
      const mem=S.peers.filter(p=>p.team===+k); if(!mem.length) return;
      let sum=0; mem.forEach(p=>{ sum += gradeOne(r,q,p.ans?.[id]).pt; });
      T[k].sc += Math.round(sum/mem.length);
    });
  }));
  return Object.entries(T).map(([k,v])=>({team:+k,sc:v.sc,n:v.n})).sort((a,b)=>b.sc-a.sc);
}
function indivScores(){
  return S.peers.map(p=>{
    let sc=0;
    ROUNDS.forEach((r,ri)=>r.qs.forEach((q,qi)=>{
      if(!counted(ri,qi)) return;
      sc += gradeOne(r,q,p.ans?.[`${ri}-${qi}`]).pt;
    }));
    return { name:p.name, team:p.team, sc };
  }).sort((a,b)=>b.sc-a.sc || a.team-b.team);
}
function indivBoard(n){
  const rows = indivScores().slice(0, n||10);
  if(!rows.length) return `<div class="card"><div class="wait" style="padding:34px 0;font-size:14px">아직 접속자가 없습니다</div></div>`;
  return `<div class="card" style="padding:6px 0">${rows.map((x,i)=>`
    <div class="rank ${i===0?"top":""}"><span class="p">${i+1}</span>
      <span class="nm">${esc(x.name)}<span class="dl">${x.team}팀</span></span>
      <span class="sc">${x.sc}</span></div>`).join("")}</div>`;
}
function board(mine){
  const r=scores();
  return `<div class="card" style="padding:6px 0">${r.map((x,i)=>`
    <div class="rank ${i===0?"top":""} ${x.team===mine?"mine":""}"><span class="p">${i+1}</span>
      <span class="nm">${x.team}팀<span class="dl">${x.n}명</span></span>
      <span class="sc">${x.sc}</span></div>`).join("") || `<div class="wait" style="padding:40px 0">아직 접속자가 없습니다</div>`}</div>`;
}
function screenFinal(){
  const iv = indivScores().slice(0,5);
  el.innerHTML = `<div class="wrap">${head("종료")}
    <h1>결과 확인</h1>
    <p class="sub">개인 점수 상위 5명입니다. 수고하셨습니다.</p>
    <div class="card" style="padding:6px 0">${iv.length ? iv.map((x,i)=>`
      <div class="rank ${i===0?"top":""} ${x.name===S.me.name&&x.team===S.me.team?"mine":""}">
        <span class="p">${i+1}</span>
        <span class="nm">${esc(x.name)}<span class="dl">${x.team}팀</span></span>
        <span class="sc">${x.sc}</span></div>`).join("")
      : `<div class="wait" style="padding:40px 0">집계된 점수가 없습니다</div>`}</div>
    <div class="card" style="margin-top:14px;text-align:center">
      <div style="font-size:13.5px;color:var(--mute)">내 점수</div>
      <div style="font-size:34px;font-weight:700;margin-top:4px">${myScore()}</div>
    </div></div>`;

function myScore(){
  let sc=0;
  ROUNDS.forEach((r,ri)=>r.qs.forEach((q,qi)=>{
    if(!counted(ri,qi)) return;
    sc += gradeOne(r,q,S.me.ans?.[`${ri}-${qi}`]).pt;

    const frac = showA ? 1 : TILE.start + (TILE.end-TILE.start)*f;
    body = `<div class="pvimg" style="position:relative"><img src="${q.img}">${tilesHTML(c.ri,c.qi,frac)}</div>`
      + `<div class="pvo">${q.o.map((o,j)=>`<span class="${showA&&j===q.a?"a":""}">${esc(o)}</span>`).join("")}</div>`;
  } else if(r.type==="ox"){
    body = `<div class="pvq">${esc(q.q)}</div><div class="pvo">
      <span class="${showA&&q.a?"a":""}" style="text-align:center;font-size:22px;font-weight:700">O</span>
      <span class="${showA&&!q.a?"a":""}" style="text-align:center;font-size:22px;font-weight:700">×</span></div>`;
  } else if(r.type==="text"){
    body = `<div class="pvq">${esc(q.q)}</div>
      <div class="pvo" style="grid-template-columns:1fr"><span>${showA?esc(q.a.split(",")[0]):"답을 입력하고 Enter"}</span></div>`;
  } else if(r.type==="order"){
    const view=shufOf(c.ri,c.qi,q.items.length);
    body = `<div class="pvq">${esc(q.q)}</div><div class="pvo" style="grid-template-columns:1fr">
      ${(showA?q.items:view.map(i=>q.items[i])).map((x,i)=>`<span class="${showA?"a":""}">${showA?(i+1)+". ":"· "}${esc(x)}</span>`).join("")}</div>`;
  } else {
    body = `<div class="pvq">${esc(q.q)}</div><div class="pvo">${q.o.map((o,j)=>`<span class="${showA&&j===q.a?"a":""}">${esc(o)}</span>`).join("")}</div>`;
  }
  return `<div class="pv">${showA?`<div style="text-align:center;color:var(--ok);font-weight:700;font-size:15px;margin-bottom:10px">정답 공개 중</div>`
    :`<div class="pvt ${t<=3?"low":""}" style="color:${t<=3?"var(--no)":"var(--ink)"}">${t}</div>
      <div style="text-align:center;color:var(--ignite);font-size:12.5px;margin:4px 0 10px">지금 맞히면 ${r.type==="image"?[30,20,10,0][(durOf(c.ri,c.qi)-t)/durOf(c.ri,c.qi)<0.29?0:(durOf(c.ri,c.qi)-t)/durOf(c.ri,c.qi)<0.64?1:2]:ptsNow()}점</div>`}
    ${badge}${body}</div>`;
}

/* 시연용 가상 교육생 — 실제 운영에서는 쓰지 않습니다 */
const SIMNAMES=["김서연","박준호","이지우","최민재","정하늘","윤도현","장예린","한승우","오세진","배수현","신가온","문태윤"];
async function simAdd(){
  for(let i=0;i<SIMNAMES.length;i++){
    await put(`p:sim${i}`, { id:"sim"+i, name:SIMNAMES[i], team:(i%4)+1, ans:{}, sim:true });
  }
  sync();
}
async function simAnswer(){
  const c=S.ctrl, r=ROUNDS[c.ri], q=curQ(c), id=qid(c);
  if(!r) return;
  const dur=durOf(c.ri,c.qi);
  for(const p of S.peers.filter(x=>x.sim)){
    const correct = Math.random() < 0.68;
    const t = 2 + Math.random()*(dur-3);
    const g = Math.min(graceOf(c.ri), dur);
    const k = t<=g ? 1 : 1 - spdOf(c.ri)*((t-g)/(dur-g));
    let a;
    if(r.type==="ox") a={v: correct?q.a:!q.a, k};
    else if(r.type==="mc") a={v: correct?q.a:(q.a+1+Math.floor(Math.random()*(q.o.length-1)))%q.o.length, k};
    else if(r.type==="text") a={v: correct?q.a.split(",")[0]:"잘 모르겠어요", k};
    else if(r.type==="image"){ const f=t/dur; const pt=[30,20,10][f<0.29?0:f<0.64?1:2];
      a={v: correct?q.a:(q.a+1)%q.o.length, pt}; }
    else if(r.type==="bet") a={v: correct?q.a:(q.a+1)%q.o.length, b:[10,20,30][Math.floor(Math.random()*3)], k:1};
    else if(r.type==="order"){ const arr=[...Array(q.items.length).keys()];
      if(!correct){ const i=Math.floor(Math.random()*(arr.length-1)); [arr[i],arr[i+1]]=[arr[i+1],arr[i]]; }
      a={v:arr, k}; }
    p.ans[id]=a;
    await put(`p:${p.id}`, p);
  }
  sync();
}

/* ── 관리자 ────────────────────────────────────────────────────── */
function screenAdmin(){
  if(S.invite) return screenInvite();
  const c=S.ctrl, r=ROUNDS[c.ri], q=curQ(c), id=qid(c);
  const done=S.peers.filter(p=>p.ans?.[id]!==undefined).length;
  const total=ROUNDS.reduce((a,x)=>a+x.qs.length,0);
  const idx=ROUNDS.slice(0,c.ri).reduce((a,x)=>a+x.qs.length,0)+c.qi+1;
  const teams=[...new Set(S.peers.map(p=>p.team))].length;
  const label = q ? (q.q || (q.o ? "제품 맞히기 — 정답: "+q.o[q.a] : "—")) : "—";

  let respHTML = "";
  if(r?.type === "text" && c.live){
    const q_pt = r.pt;
    const rows = S.peers.filter(p=>p.ans?.[id]!==undefined).sort((a,b)=>a.team-b.team||a.name.localeCompare(b.name))
      .map(p=>{ const av=p.ans[id], ok=textOK(av.v,q), sc=ok?Math.round(q_pt*(av.k??1)):0;
        return `<div class="resp ${ok?"y":"n"}"><span class="who">${p.team}팀 ${esc(p.name)}</span>
          <span class="val">${esc(av.v)}</span><span class="mk">${ok?`O +${sc}`:"X"}</span></div>`; }).join("");
    respHTML = `<h3>주관식 응답 (${done} / ${S.peers.length}명)</h3>
      <p class="tiny" style="margin:0 0 10px">인정 정답: <b style="color:var(--ink)">${esc(q.a.split(",").join("  /  "))}</b></p>
      <div class="card" style="padding:4px 0;max-height:430px;overflow:auto">
        ${rows || `<div class="wait" style="padding:34px 0;font-size:14px">아직 응답이 없습니다</div>`}</div>`;
  }

  el.innerHTML = `<div class="wrap wide">
    <div class="bar"><span><b>관리자</b> · 세션 <b style="color:var(--ignite)">${esc(S.code)}</b></span>
      <span class="rt"><span class="chip">${S.peers.length}명 · ${teams}개 팀</span>
      <button class="home" data-home>처음으로</button></span></div>
    <div class="cols"><div>
      ${!c.live?`<h2>아직 시작 전입니다</h2>
        <p class="sub">교육생에게 세션 코드 <b style="color:var(--ignite)">${esc(S.code)}</b>를 안내하고,
        우측에서 전원 접속을 확인한 뒤 시작하세요.</p><button class="go" id="begin">퀴즈 시작</button>`:`
        <div class="card" style="border-color:var(--flame)">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;color:var(--mute)">
            <span>${esc(r?.name||"종료")}${r?` · ${durOf(c.ri,c.qi)}초`:""}</span>
            <span>${idx} / ${total} · 응답 <b style="color:var(--ink)">${done}</b>/${S.peers.length}</span></div>
          <div style="font-size:19px;line-height:1.5;margin:14px 0 20px;font-weight:600">${esc(label)}</div>
          <div class="row">
            <button class="ctl" id="prev" style="background:var(--panel2);border:1px solid var(--line);color:var(--mute)">← 이전</button>
            <button class="ctl" id="show" style="background:${c.show?"var(--panel2)":"var(--ignite)"};border:1px solid ${c.show?"var(--line)":"var(--ignite)"};color:${c.show?"var(--mute)":"#0B1226"}">${c.show?"정답 닫기":"정답 먼저 공개"}</button>
            <button class="ctl" id="next" style="background:var(--flame);color:#0B1226">다음 →</button></div>
          <p class="tiny">제한시간이 끝나면 교육생 화면에는 <b style="color:var(--ink)">정답이 자동으로 공개</b>됩니다.
            '정답 먼저 공개'는 전원이 일찍 응답했을 때 기다리지 않고 바로 넘어가는 용도입니다.<br>
            '다음'을 누르면 타이머가 새로 시작되고, 마지막 문제에서 누르면 최종 순위로 넘어갑니다.</p>
        </div>${respHTML}`}
      <div class="simbar" style="margin-top:16px">
        <button id="invite" style="border-style:solid;border-color:var(--flame);color:var(--ignite);font-weight:650">교육생 접속 안내 화면 띄우기</button>
      </div>
      <h3>라운드 바로가기</h3>
      <div class="abar">${ROUNDS.map((x,i)=>`<button data-r="${i}" class="${c.ri===i?"on":""}">${esc(x.name.split("·")[0].trim())}</button>`).join("")}
        <button data-r="end" class="${c.ri>=ROUNDS.length?"on":""}">최종 순위</button></div>
      <button class="ghost" id="reset">세션 초기화</button>
    </div><div>
      <h3 style="margin-top:0">교육생 화면</h3>
      ${previewHTML()}
      <div class="simbar">
        <button id="simadd">시연용 가상 교육생 12명</button>
        <button id="simans">이 문제 응답 채우기</button>
      </div>
      <h3>팀 평균 점수</h3>${board(null)}
      <h3>개인 순위 (상위 10명)</h3>${indivBoard(10)}
      ${(()=>{ const iv=indivScores(), tm=scores();
        if(!iv.length||!tm.length) return "";
        return `<div class="card" style="border-color:var(--ignite);margin-top:12px">
          <div style="font-size:13.5px;color:var(--mute);margin-bottom:10px">시상 대상 (현재 기준)</div>
          <div style="font-size:15px;line-height:1.95">
            <b style="color:var(--ignite)">개인 1위</b> ${esc(iv[0].name)} (${iv[0].team}팀) · ${iv[0].sc}점<br>
            <span style="color:var(--mute)">→ ${iv[0].team}팀 시상</span><br>
            <b style="color:var(--ignite)">팀 평균 1위</b> ${tm[0].team}팀 · ${tm[0].sc}점
          </div></div>`; })()}
      <p class="note">교육생 화면에는 팀 점수만 보이고 개인 점수는 본인 것만 보입니다. 이 화면에서만 개인 순위가 집계됩니다.
        팀 점수는 팀원 점수의 평균이라 인원이 달라도 공평합니다.</p>
      <div class="envnote">저장 방식: <b style="color:var(--ink)">Supabase (실시간 서버 DB)</b><br>
        인터넷이 되는 모든 기기에서 로그인 없이 실시간으로 연동됩니다.</div>
    </div></div></div>`;
  bindHome();
  el.querySelector("#begin")?.addEventListener("click",async(ev)=>{
    const btn=ev.currentTarget; btn.disabled=true; btn.textContent="시작하는 중…";
    const r = await put("ctrl",{...D0,live:true,started:Date.now()});
    if(!r){ btn.disabled=false; btn.textContent="퀴즈 시작";
      alert("서버에 저장하지 못했습니다.\n"+(CONN_ERR||"콘솔(F12)에서 에러 메시지를 확인해 주세요.")); return; }
    sync(S.epoch);
  });
  el.querySelector("#show")?.addEventListener("click",async()=>{ await put("ctrl",{...c,show:!c.show}); sync(); });
  el.querySelector("#prev")?.addEventListener("click",async()=>{
    let {ri,qi}=c;
    if(qi>0) qi--; else if(ri>0){ ri--; qi=ROUNDS[ri].qs.length-1; }
    await put("ctrl",{...c,ri,qi,show:false,started:Date.now()}); sync(); });
  el.querySelector("#next")?.addEventListener("click",async()=>{
    let {ri,qi}=c;
    if(qi<ROUNDS[ri].qs.length-1) qi++;
    else if(ri<ROUNDS.length-1){ ri++; qi=0; }
    else { await put("ctrl",{...c,ri:ROUNDS.length,show:true}); sync(); return; }
    await put("ctrl",{...c,ri,qi,show:false,started:Date.now()}); sync(); });
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{
    const v=b.dataset.r;
    await put("ctrl",{...c,live:true,ri:v==="end"?ROUNDS.length:+v,qi:0,show:false,started:Date.now()}); sync(); });
  el.querySelector("#invite")?.addEventListener("click", ()=>{ S.invite=true; screenInvite(); });
  el.querySelector("#simadd")?.addEventListener("click", simAdd);
  el.querySelector("#simans")?.addEventListener("click", simAnswer);
  el.querySelector("#reset").onclick=async()=>{
    if(!confirm("모든 교육생 응답을 삭제합니다. 계속할까요?")) return;
    try{ const rr=await STORE.list(`bq2:${S.code}:`,true);
      for(const k of (rr?.keys||[])) await STORE.delete(k,true); }catch(e){}
    await put("ctrl",D0); sync(); };
}

/* ── 부팅 ──────────────────────────────────────────────────────── */
(async () => {
  await checkConnection();
  const s = localStorage.getItem("bq2_me");
  if(s){ try{ const {code,pid}=JSON.parse(s); S.code=code; S.pid=pid;
    const me=await get(`p:${pid}`); if(me){ S.me=me; return start(); } }catch(e){} }
  screenJoin();
})();

setInterval(() => {
  if(!S.me || S.admin || !S.ctrl?.live) return;
  paint();
}, 400);
</script>
